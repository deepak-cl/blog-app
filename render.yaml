services:
  - type: web
    name: personal-api-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Optional — enable AI Daily Brief on the dashboard (set at least one)
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
      # Optional — reliable Bengaluru/India weather when Open-Meteo rate-limits Render
      # Register free at https://api.imd.gov.in/public/index.php
      # - key: IMD_API_KEY
      #   sync: false
      # - key: IMD_CITY_ID
      #   value: "42182"
      # Free global fallback: https://openweathermap.org/api (1M calls/month)
      # - key: OPENWEATHER_API_KEY
      #   sync: false
